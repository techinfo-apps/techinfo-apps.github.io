# Every day at 21:10 Beijing time (13:10 UTC), after the evening episode goes public on YouTube:
# put up the tutorial episodes that became public, and push. Also runs by hand (Actions → Tutorials → Run workflow).
name: Tutorials
on:
  schedule:
    - cron: "10 13 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: write
  pages: write
concurrency:
  group: tutorials
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask YouTube which episodes are public, build the pages
        run: python3 tools/build_videos.py
      - name: Commit and push if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A videos assets/videos-strings.js
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name="Technology Information" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Tutorials: a new episode is up"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || true
      # GitHub pauses scheduled runs after 60 days without activity (long gaps between seasons);
      # enabling the workflow again every day restarts that count.
      - name: Keep the daily run alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/videos.yml/enable" || true
